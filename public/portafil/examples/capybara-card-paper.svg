<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 152" width="100%" role="img" aria-label="Capibara en modo foco">
  <title>Capibara · Compañero de GitHub (Papel)</title>
  <style>
    .card-bg { fill: #faf8f5; stroke: #d6d1c7; stroke-width: 1.5; }
    .stage-bg { fill: #f0ede6; stroke: #d6d1c7; stroke-width: 1; }
    .bubble-bg { fill: #f0ede6; stroke: #d6d1c7; stroke-width: 1; }
    .chip-bg { fill: #ddebd8; stroke: #2f6f3e; stroke-width: 1; }
    .title { fill: #18181b; font: 700 16px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .subtitle { fill: #57534e; font: 500 11.5px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .chip-text { fill: #2f6f3e; font: 700 10.5px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .quote { fill: #18181b; font: 500 12.5px system-ui, -apple-system, sans-serif; }
    .footer { fill: #57534e; font: 500 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .accent { fill: #2f6f3e; font: 700 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .floor { fill: #e4dfd6; }
    .sprite-strip { image-rendering: pixelated; animation: sprite-steps 0.67s steps(4) infinite; }
    @keyframes sprite-steps { from { transform: translateX(0px); } to { transform: translateX(-384px); } }
  </style>
  <defs><clipPath id="pet-clip-card"><rect x="0" y="0" width="96" height="96" rx="12" /></clipPath></defs>
  <rect class="card-bg" x="1" y="1" width="538" height="150" rx="16" />
  <rect class="stage-bg" x="16" y="16" width="112" height="120" rx="14" />
  <ellipse class="floor" cx="72" cy="116" rx="34" ry="7" />
  <g transform="translate(24, 20)" clip-path="url(#pet-clip-card)">
    <g transform="translate(0, -384)">
      <image class="sprite-strip" href="data:image/png;base64," width="576" height="576" />
    </g>
  </g>
  <text class="title" x="144" y="36">Capibara</text>
  <text class="subtitle" x="144" y="54">luisrodriguez-rgb/My-Skin</text>
  <rect class="chip-bg" x="386" y="18" width="136" height="24" rx="12" />
  <text class="chip-text" x="454" y="34" text-anchor="middle">● MODO FOCO</text>
  <rect class="bubble-bg" x="144" y="66" width="378" height="50" rx="10" />
  <text class="quote" x="156" y="95">“La calma lo resuelve todo. Respira profundo y pr…”</text>
  <text class="footer" x="144" y="136">MySkin × Portafil</text>
  <text class="accent" x="522" y="136" text-anchor="end">Tema Papel</text>
</svg>