<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="320" height="84" style="max-width:100%;height:auto;" role="img" aria-label="Dev fantasma: Invocando código limpio desde las …">
  <title>Dev fantasma — Mascota de repositorio</title>
  <style>
    .bg { fill: #0a0e0c; stroke: #1f3528; stroke-width: 1.5; }
    .stage { fill: #111915; stroke: #1f3528; stroke-width: 1; }
    .name { fill: #d9fbe5; font: 700 13px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .badge { fill: #39d353; font: 700 10px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .msg { fill: #76a889; font: 500 11px system-ui, -apple-system, sans-serif; }
    .sprite-strip { image-rendering: pixelated; animation: sprite-steps 0.67s steps(4) infinite; }
    @keyframes sprite-steps { from { transform: translateX(0px); } to { transform: translateX(-256px); } }
  </style>
  <defs><clipPath id="pet-clip-badge"><rect x="0" y="0" width="64" height="64" rx="10" /></clipPath></defs>
  <rect class="bg" x="1" y="1" width="318" height="82" rx="14" />
  <rect class="stage" x="10" y="10" width="64" height="64" rx="10" />
  <g transform="translate(10, 10)" clip-path="url(#pet-clip-badge)">
    <g transform="translate(0, -256)">
      <image class="sprite-strip" href="data:image/png;base64," width="384" height="384" />
    </g>
  </g>
  <text class="name" x="86" y="27">Dev fantasma</text>
  <text class="badge" x="306" y="26" text-anchor="end">● MODO FOCO</text>
  <text class="msg" x="86" y="47">Invocando código limpio desde las …</text>
  <text class="msg" x="86" y="63">luisrodriguez-rgb/portafil</text>
