<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 88" width="100%" role="img" aria-label="Capibara patrullando el repositorio">
  <title>Capibara — Separador animado de repositorio</title>
  <style>
    .bg { fill: #111214; stroke: #2a2e37; stroke-width: 1.5; }
    .track { stroke: #232730; stroke-width: 2; stroke-dasharray: 6 6; }
    .accent-dot { fill: #c0e798; }
    .label { fill: #9ca3af; font: 600 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tag { fill: #c0e798; font: 700 10px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .patrol-carrier { animation: patrol-move 14s linear infinite; }
    .sprite-strip { image-rendering: pixelated; animation: sprite-steps 0.6s steps(6) infinite; }
    @keyframes sprite-steps { from { transform: translateX(0px); } to { transform: translateX(-384px); } }
    @keyframes patrol-move {
      0% { transform: translateX(28px) scaleX(1); }
      48% { transform: translateX(616px) scaleX(1); }
      50% { transform: translateX(616px) scaleX(-1); }
      98% { transform: translateX(28px) scaleX(-1); }
      100% { transform: translateX(28px) scaleX(1); }
    }
  </style>
  <defs><clipPath id="pet-clip-div"><rect x="-32" y="0" width="64" height="64" /></clipPath></defs>
  <rect class="bg" x="1" y="1" width="718" height="86" rx="12" />
  <line class="track" x1="24" y1="68" x2="696" y2="68" />
  <circle class="accent-dot" cx="24" cy="68" r="3.5" />
  <circle class="accent-dot" cx="696" cy="68" r="3.5" />
  <text class="tag" x="24" y="24">[EN PATRULLA]</text>
  <text class="label" x="696" y="24" text-anchor="end">Capibara patrullando luisrodriguez-rgb/My-Skin</text>
  <g transform="translate(0, 8)">
    <g class="patrol-carrier">
      <g clip-path="url(#pet-clip-div)">
        <g transform="translate(-32, -64)">
          <image class="sprite-strip" href="data:image/png;base64," width="384" height="384" />
        </g>
      </g>
    </g>
  </g>
</svg>