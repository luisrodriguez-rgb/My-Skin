<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MySkin Desktop Companion</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Canvas principal donde vive el personaje en el escritorio -->
    <canvas id="pet-canvas" width="300" height="240"></canvas>

    <!-- MySkin Controller: Pixel Minimal UI -->
    <aside id="debug-panel" class="controller-panel hidden" aria-label="MySkin Controller">
      <!-- Header -->
      <header class="controller-header">
        <div class="brand">
          <h1 class="brand-title">MySkin</h1>
          <span class="brand-tag">DESKTOP COMPANION</span>
        </div>
        <div class="header-controls">
          <button id="btn-sound-toggle" class="btn-sound-toggle" title="Alternar Sonido Retro">AUDIO: ON</button>
          <button id="btn-close-debug" class="btn-close" title="Ocultar controlador (tecla D o clic derecho)">✕</button>
        </div>
      </header>

      <!-- Active Character Card -->
      <section class="card-character">
        <div class="char-thumb-wrapper">
          <canvas id="thumb-canvas" width="48" height="48"></canvas>
          <span class="badge-status">Activo</span>
        </div>
        <div class="char-info">
          <div class="char-meta">
            <h2 id="char-name" class="char-title">Leónidas (El Espartano de 300)</h2>
            <span id="char-spec" class="char-subtitle">Skin pixel · 64 × 64</span>
          </div>
          <div class="char-select-wrapper">
            <select id="select-skin" class="skin-select" aria-label="Cambiar personaje">
              <optgroup label="Ola 1: Fundacionales">
                <option value="spartan">01. Leónidas (El Espartano de 300)</option>
                <option value="spiderman">02. Spider-Hero (El Trepamuros)</option>
                <option value="dev-avatar">03. Mi Avatar Pixelado (Tú Mismo)</option>
                <option value="ghost-dev">04. El Dev Fantasma (Especial Código)</option>
              </optgroup>
              <optgroup label="Ola 2: Entretenimiento y Memes">
                <option value="football-10">05. El Futbolista 10 (La Pulga)</option>
                <option value="capybara">06. Capibara Chill (Mascota Internet)</option>
                <option value="cyber-ninja">07. Cyber Ninja (Acción y Sigilo)</option>
              </optgroup>
              <optgroup label="Ola 3: Nostalgia y Fantasía">
                <option value="fantasy-wizard">08. Mago de Fantasía (El Hechicero)</option>
                <option value="game-slime">09. Slime de Videojuego (Mascota)</option>
                <option value="astro-lost">10. Astronauta Perdido (Explorador)</option>
              </optgroup>
            </select>
          </div>
        </div>
      </section>

      <!-- Animation / FSM Section -->
      <section class="panel-group">
        <div class="group-header">
          <span class="group-title">ANIMACIÓN</span>
          <span class="group-caption">Vista previa</span>
        </div>
        <div class="btn-grid-actions">
          <button class="btn-chip btn-action active" data-action="IDLE">
            <span class="chip-code">00</span>
            <span class="chip-label">IDLE</span>
          </button>
          <button class="btn-chip btn-action" data-action="WALK">
            <span class="chip-code">01</span>
            <span class="chip-label">WALK</span>
          </button>
          <button class="btn-chip btn-action" data-action="ALERT_SEMESTRE">
            <span class="chip-code">02</span>
            <span class="chip-label">ALERT</span>
          </button>
          <button class="btn-chip btn-action" data-action="VICTORY_GITHUB">
            <span class="chip-code">03</span>
            <span class="chip-label">WIN</span>
          </button>
          <button class="btn-chip btn-action" data-action="FOCUS">
            <span class="chip-code">04</span>
            <span class="chip-label">FOCUS</span>
          </button>
          <button class="btn-chip btn-action" data-action="SLEEP">
            <span class="chip-code">05</span>
            <span class="chip-label">SLEEP</span>
          </button>
        </div>
      </section>

      <!-- Pomodoro Concentration System (Fase 3) -->
      <section class="panel-group">
        <div class="group-header">
          <span class="group-title">POMODORO ESTUDIO</span>
          <span id="pomo-status" class="group-caption">En reposo</span>
        </div>
        <div class="pomodoro-card">
          <span id="pomo-clock" class="pomodoro-clock">25:00</span>
          <div class="pomodoro-actions">
            <button id="btn-pomo-toggle" class="btn-pomo-toggle">INICIAR FOCO</button>
            <button id="btn-pomo-reset" class="btn-pomo-reset">RESET</button>
          </div>
        </div>
      </section>

      <!-- Notification Simulator -->
      <section class="panel-group">
        <div class="group-header">
          <span class="group-title">PROBAR DIÁLOGOS</span>
          <span class="group-caption">Eventos</span>
        </div>
        <div class="btn-grid-events">
          <button id="btn-event-semester" class="btn-event btn-event-semester">
            <span class="event-code">SEM</span>
            <span class="event-label">Entrega Semestre</span>
          </button>
          <button id="btn-event-github" class="btn-event btn-event-github">
            <span class="event-code">GIT</span>
            <span class="event-label">GitHub Merge</span>
          </button>
        </div>
      </section>

      <!-- Footer Status -->
      <footer class="controller-footer">
        <div class="footer-state">
          <span class="state-dot"></span>
          <span id="status-fsm-text">Estado: IDLE</span>
        </div>
        <span class="shortcut-tip">Doble Clic o [Cmd+Shift+D]</span>
      </footer>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
